<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>09 — AJAX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>AJAX Demo</h1>

  <div class="panel">
    <h2>fetch() — the modern approach (same idea as folder 07)</h2>
    <button id="fetch-btn">Get a random post via fetch()</button>
    <p id="fetch-result"></p>
  </div>

  <div class="panel">
    <h2>XMLHttpRequest — the older approach (recognise it, don't reach for it)</h2>
    <button id="xhr-btn">Get a random post via XHR</button>
    <p id="xhr-result"></p>
  </div>

  <script src="demo.js" defer></script>
</body>
</html>
