<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>11 — Cookies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Cookies Demo</h1>

  <div class="panel">
    <input type="text" id="name-input" placeholder="Your name">
    <button id="set-btn">Set username cookie</button>
    <button id="delete-btn">Delete cookie</button>

  <div class="panel">
    <h2>Raw document.cookie</h2>
    <pre id="cookie-display"></pre>
    <button id="refresh-btn">Refresh</button>
  </div>

  <script src="demo.js" defer></script>
</body>
</html>
