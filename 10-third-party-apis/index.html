<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>10 — Third-Party APIs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Third-Party API Demo — Live Weather</h1>
  <!-- Open-Meteo: free, no API key needed, good first "real" API -->
  <p>Uses <code>open-meteo.com</code> — a real, free weather API, no key required.</p>

  <form id="city-form">
    <input type="text" id="city-input" placeholder="e.g. Cape Town" value="Cape Town">
    <button type="submit">Get Weather</button>
  </form>

  <p class="status" id="status"></p>
  <div id="weather-output"></div>

  <script src="demo.js" defer></script>
</body>
</html>
