<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>02 — Functions and Methods</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Functions and Methods Demo</h1>

  <!-- Card 1: a plain function -->
  <div class="card">
    <h2>Function declaration</h2>
    <input id="name-input" type="text" placeholder="Your name">
    <button id="greet-btn">Greet</button>
    <p class="result" id="greet-result"></p>
  </div>

  <!-- Card 2: an object with a method -->
  <div class="card">
    <h2>Method on an object</h2>
    <button id="method-btn">Call person.sayHi()</button>
    <p class="result" id="method-result"></p>
  </div>

  <!-- Card 3: array methods (methods you'll use constantly) -->
  <div class="card">
    <h2>Built-in array methods</h2>
    <button id="array-btn">Run map / filter / reduce on a list of prices</button>
    <p class="result" id="array-result"></p>
  </div>

  <script src="demo.js" defer></script>
</body>
</html>
